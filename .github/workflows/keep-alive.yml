name: Supabase Keep Alive

on:
  schedule:
    # Berjalan pada pukul 12:00 tengah malam setiap 3 hari
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Membolehkan trigger manual dari tab Actions di GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth API (Login Test)
        run: |
          curl -i -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "cikgu2@test.edu.my",
              "password": "Test@1234"
            }'
